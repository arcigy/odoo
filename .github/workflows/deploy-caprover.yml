name: Deploy Odoo to CapRover

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: geotherm-odoo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Odoo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate Odoo addon sources
        shell: bash
        run: |
          python -m compileall -q addons
          python integrations/validate_odoo_addons.py
      - name: Test bounded integration contracts
        shell: bash
        run: node --test integrations/*.test.mjs
      - name: Build isolated Odoo test image
        shell: bash
        run: docker build -t "geotherm-odoo-ci:$GITHUB_SHA" .
      - name: Start isolated PostgreSQL test database
        shell: bash
        run: |
          docker network create geotherm-odoo-ci
          docker run -d --name geotherm-odoo-ci-db \
            --network geotherm-odoo-ci \
            -e POSTGRES_DB=geotherm_ci \
            -e POSTGRES_USER=odoo \
            -e POSTGRES_PASSWORD=odoo-ci-password \
            postgres:16-alpine
          ready=0
          for _ in $(seq 1 30); do
            if docker exec geotherm-odoo-ci-db pg_isready -U odoo -d geotherm_ci; then
              ready=1
              break
            fi
            sleep 2
          done
          [[ "$ready" == "1" ]] || { echo 'PostgreSQL CI database did not become ready.' >&2; exit 1; }
      - name: Test Odoo 19 modules on a fresh database
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            --network geotherm-odoo-ci \
            -e HOST=geotherm-odoo-ci-db \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo-ci-password \
            -e ODOO_DB_NAME=geotherm_ci \
            -e ODOO_MASTER_PASSWORD=odoo-ci-master-password \
            "geotherm-odoo-ci:$GITHUB_SHA" \
            odoo \
            --init=geotherm_chatbot,geotherm_drive,arcigy_saas_control_center \
            --without-demo \
            --test-enable \
            --test-tags=/arcigy_saas_control_center \
            --stop-after-init 2>&1 | tee odoo-test.log
          grep -Eq '0 failed, 0 error\(s\) of [1-9][0-9]* tests' odoo-test.log
      - name: Remove isolated test resources
        if: always()
        shell: bash
        run: |
          docker rm -f geotherm-odoo-ci-db >/dev/null 2>&1 || true
          docker network rm geotherm-odoo-ci >/dev/null 2>&1 || true
      - name: Validate immutable deployment archive
        shell: bash
        run: bash integrations/create_odoo_deploy_archive.sh validation-deploy.tar "$GITHUB_SHA"

  deploy:
    name: Deploy Odoo to CapRover
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create deployment archive
        shell: bash
        run: bash integrations/create_odoo_deploy_archive.sh deploy.tar "$GITHUB_SHA"
      - name: Deploy to CapRover
        shell: bash
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          # The public Odoo instance is the Arcigy service.  The legacy
          # geotherm-odoo service is deliberately scaled to zero and must
          # never receive a production Control Center deployment.
          CAPROVER_APP_NAME: arcigy-odoo
          CAPROVER_APP_URL: https://arcigy-odoo.178.104.175.242.sslip.io
        run: |
          set -euo pipefail
          : "${CAPROVER_APP_URL:?CAPROVER_APP_URL secret is required}"
          login_json=$(curl -fsS --retry 12 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 30 \
            -X POST "$CAPROVER_URL/api/v2/login" \
            -H 'content-type: application/json' \
            --data "$(jq -cn --arg password "$CAPROVER_PASSWORD" '{password:$password}')")
          token=$(jq -er '.data.token' <<< "$login_json")
          deploy_json=$(curl -fsS -X POST "$CAPROVER_URL/api/v2/user/apps/appData/$CAPROVER_APP_NAME?detached=1" \
            -H 'x-namespace: captain' \
            -H "x-captain-auth: $token" \
            -F 'sourceFile=@deploy.tar' \
            -F "gitHash=$GITHUB_SHA")
          jq -e '.status == 100 or .status == 101 or .status == 102' <<< "$deploy_json" > /dev/null

          completed=0
          for _ in $(seq 1 90); do
            app_json=$(curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 30 \
              -H 'x-namespace: captain' \
              -H "x-captain-auth: $token" \
              "$CAPROVER_URL/api/v2/user/apps/appData/$CAPROVER_APP_NAME")
            jq -e '.status == 100 or .status == 101 or .status == 102' <<< "$app_json" > /dev/null
            if [[ "$(jq -r '.data.isBuildFailed // false' <<< "$app_json")" == "true" ]]; then
              echo "CapRover build failed" >&2
              exit 1
            fi
            if [[ "$(jq -r '.data.isAppBuilding // false' <<< "$app_json")" == "false" ]]; then
              completed=1
              break
            fi
            sleep 10
          done
          [[ "$completed" == "1" ]] || { echo "CapRover build timed out" >&2; exit 1; }
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors \
            "$CAPROVER_APP_URL/web/login" > /dev/null
